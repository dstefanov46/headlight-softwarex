name: lightweight-ci

on:
  push:
  pull_request:

jobs:
  python-and-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight Python dependencies
        run: |
          python -m pip install --upgrade pip==24.2
          python -m pip install -r requirements-dev.txt
          python -m pip install -r ai-module/ai-module/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Validate configuration
        run: make validate-config
      - name: Check public documentation
        run: make docs-check
      - name: Run Python unit tests
        run: make python-tests
      - name: Validate YAML
        run: make yaml-validate
      - name: Reproduction workflow dry run
        run: make reproduction-dry-run
      - name: Artifact consistency tests
        run: python -m unittest experiments.tests.test_artifact_validation
      - name: Dependency license report
        run: make license-check

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Go formatting
        run: |
          test -z "$(gofmt -l actions-handler controlled-replica-propagation | tee /dev/stderr)"
      - name: Go tests
        run: make go-tests
