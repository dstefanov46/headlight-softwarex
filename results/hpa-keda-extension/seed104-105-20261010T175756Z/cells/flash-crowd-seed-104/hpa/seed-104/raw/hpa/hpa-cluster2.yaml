apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ts-basic-hpa
  namespace: trainticket
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ts-basic
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 90
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 600
---
