apiVersion: v1
kind: Namespace
metadata:
  name: trainticket
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-auth-mongo
  namespace: trainticket
spec:
  selector:
    matchLabels:
      app: ts-auth-mongo
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ts-auth-mongo
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      containers:
      - name: ts-auth-mongo
        image: mongo:4.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
        resources:
          requests:
            cpu: 25m
            memory: 512Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: 200m
            memory: 1Gi
            ephemeral-storage: 2Gi
      automountServiceAccountToken: false
  replicas: 1
---
