apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-basic
  namespace: trainticket
spec:
  selector:
    matchLabels:
      app: ts-basic
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ts-basic
      annotations:
        sidecar.istio.io/inject: 'true'
        sidecar.istio.io/proxyCPU: 20m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyCPULimit: 200m
        sidecar.istio.io/proxyMemoryLimit: 192Mi
    spec:
      containers:
      - name: ts-basic
        image: codewisdom/ts-basic-service:0.0.4
        imagePullPolicy: Always
        ports:
        - containerPort: 15680
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
        readinessProbe:
          tcpSocket:
            port: 15680
          initialDelaySeconds: 160
          periodSeconds: 10
          timeoutSeconds: 5
      automountServiceAccountToken: false
  replicas: 1
