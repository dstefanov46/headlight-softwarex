apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: prometheus
  namespace: monitoring
spec:
  resourceSelectors:
    - apiVersion: v1
      kind: Namespace
      name: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: prometheus-server
  placement:
    clusterAffinity:
      clusterNames:
        - cluster2
        - cluster3
