apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: locust-worker
  template:
    metadata:
      labels:
        app: locust-worker
    spec:
      automountServiceAccountToken: false
      containers:
      - name: locust-worker
        image: {{ .Values.worker.image.repository }}
        args: ["--worker", "--master-host=locust-master", "-f", "/app/load_generator.py"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
