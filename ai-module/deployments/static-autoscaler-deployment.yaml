apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-autoscaler
  namespace: trainticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: static-autoscaler
  template:
    metadata:
      labels:
        app: static-autoscaler
    spec:
      containers:
      - name: autoscaler
        image: ${HEADLIGHT_STATIC_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /app/static_autoscaler.py
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
      automountServiceAccountToken: false
