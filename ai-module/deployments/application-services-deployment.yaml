apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-admin-basic-info
spec:
  selector:
    matchLabels:
      app: ts-admin-basic-info
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ts-admin-basic-info
    spec:
      containers:
      - name: ts-admin-basic-info
        image: codewisdom/ts-admin-basic-info-service:0.0.4
        imagePullPolicy: Always
        ports:
        - containerPort: 18767
        resources:
          requests:
            cpu: 25m
            memory: 50Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 200m
            memory: 500Mi
            ephemeral-storage: 1Gi
        readinessProbe:
          tcpSocket:
            port: 18767
          initialDelaySeconds: 160
          periodSeconds: 10
          timeoutSeconds: 5
      automountServiceAccountToken: false
---
