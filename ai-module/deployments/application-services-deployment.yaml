kind: Deployment
metadata:
  name: ts-security
spec:
  selector:
    matchLabels:
      app: ts-security
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ts-security
    spec:
      containers:
      - name: ts-security
        image: codewisdom/ts-security-service:0.0.4
        imagePullPolicy: Always
        ports:
        - containerPort: 11188
        resources:
          requests:
            cpu: 25m
            memory: 80Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 200m
            memory: 500Mi
            ephemeral-storage: 1Gi
        readinessProbe:
          tcpSocket:
            port: 11188
          initialDelaySeconds: 160
          periodSeconds: 10
          timeoutSeconds: 5
      automountServiceAccountToken: false
