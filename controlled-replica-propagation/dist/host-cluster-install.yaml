apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: controlled-replica-propagation
    control-plane: controller-manager
  name: crp-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: controlled-replica-propagation
    control-plane: controller-manager
  name: crp-controller-manager-metrics-service
  namespace: crp-system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: controlled-replica-propagation
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: controlled-replica-propagation
    control-plane: controller-manager
  name: crp-controller-manager
  namespace: crp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controlled-replica-propagation
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: controlled-replica-propagation
        control-plane: controller-manager
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --kubeconfig=/karmadaconfig/karmada.config
        command:
        - /manager
        image: ghcr.io/vidbregar/controlled-replica-propagation:0.2.1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports: []
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
            ephemeral-storage: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
            ephemeral-storage: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /karmadaconfig
          name: karmadaconfig
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      volumes:
      - name: karmadaconfig
        secret:
          secretName: karmada-crp-config
