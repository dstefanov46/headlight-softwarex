# This rule is not used by the project controlled-replica-propagation itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants the full standard resource permissions over policy.nephele-project.eu.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: controlled-replica-propagation
    app.kubernetes.io/managed-by: kustomize
  name: controlledreplicapropagation-admin-role
rules:
- apiGroups:
  - policy.nephele-project.eu
  resources:
  - controlledreplicapropagations
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - policy.nephele-project.eu
  resources:
  - controlledreplicapropagations/status
  verbs:
  - get
