# This rule is not used by the project controlled-replica-propagation itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the policy.nephele-project.eu.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: controlled-replica-propagation
    app.kubernetes.io/managed-by: kustomize
  name: controlledreplicapropagation-editor-role
rules:
- apiGroups:
  - policy.nephele-project.eu
  resources:
  - controlledreplicapropagations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy.nephele-project.eu
  resources:
  - controlledreplicapropagations/status
  verbs:
  - get
