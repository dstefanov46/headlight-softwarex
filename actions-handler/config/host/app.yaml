apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: actions-handler
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: actions-handler
spec:
  serviceName: "actions-handler"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: actions-handler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actions-handler
    spec:
      automountServiceAccountToken: false
      containers:
        - name: actions-handler
          image: actions-handler:0.2.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 512Mi
          env:
            - name: BATCH_PLACEMENTS_DIR
              value: "/var/lib/batch-placement-updates"
            - name: KARMADA_CONFIG_PATH
              value: "/karmadaconfig/karmada.config"
            - name: BATCH_SUBMIT_CRON
              value: "* * * * *"
          volumeMounts:
            - name: actions-handler-store
              mountPath: /var/lib/batch-placement-updates
            - name: karmadaconfig
              mountPath: /karmadaconfig
              readOnly: true
      volumes:
        - name: karmadaconfig
          secret:
            secretName: karmada-ah-config
  volumeClaimTemplates:
    - metadata:
        name: actions-handler-store
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: actions-handler
spec:
  selector:
    app.kubernetes.io/name: actions-handler
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
