apiVersion: v1
kind: Service
metadata:
  name: actions-handler
spec:
  selector:
    app.kubernetes.io/name: actions-handler
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: actions-handler
spec:
  resourceSelectors:
    - apiVersion: v1
      kind: Service
      name: actions-handler
  placement:
    clusterAffinity:
      clusterNames:
        - cluster2
        - cluster3
