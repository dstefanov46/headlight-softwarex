apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: actions-handler
  name: actions-handler-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actions-handler-manager
rules:
  - apiGroups:
      - policy.nephele-project.eu
    resources:
      - controlledreplicapropagations
    verbs:
      - create
      - delete
      - deletecollection
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: actions-handler
  name: actions-handler-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: actions-handler-manager
subjects:
  - kind: ServiceAccount
    name: actions-handler-manager
    namespace: actions-handler-system
---
