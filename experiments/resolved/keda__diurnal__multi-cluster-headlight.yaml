apiVersion: headlight.experiments/v1alpha1
kind: ResolvedExperimentManifest
metadata:
  name: keda__diurnal__multi-cluster-headlight
spec:
  controller:
    controller: keda
    implementation_state: ready
    setup_script: experiments/scripts/install_keda_baseline.sh
    metrics_collector: ai-module/metrics/fetch_service_metrics.py
    actuation_path: keda
    notes: Native KEDA baseline using CPU plus Prometheus/Istio request-rate ScaledObject
      triggers.
    sampling_interval_seconds: 15
    controller_variant: native-keda
    helm_repository: https://kedacore.github.io/charts
    helm_namespace: keda
  topology:
    mode: multi-cluster-headlight
    namespace: trainticket
    active_clusters:
    - cluster2
    - cluster3
    clusters_file: ai-module/configs/clusters.json
    services_file: ai-module/configs/application_services.json
    additional_services_file: ai-module/configs/additional_services.json
    placement_source: actions-handler
    notes: Dynamic multi-cluster mode using Actions Handler and ControlledReplicaPropagation.
  workload:
    pattern: diurnal
    duration_seconds: 2400
    warmup_seconds: 480
    capacity_users: 10
    capacity_users_env: HEADLIGHT_EVALUATION_CAPACITY
    locust:
      spawn_rate: 20
      min_users: 0.2C
      max_users: C
      cycle_seconds: 1200
      phase_offset_seconds: 0
    notes: Two compressed daily cycles for repeatable paper runs.
    sampling_interval_seconds: 15
    shape_parameters:
      spawn_rate: 20
      min_users: 0.2C
      max_users: C
      cycle_seconds: 1200
      phase_offset_seconds: 0
  run:
    controller_profile: experiments/configs/baselines/keda.yaml
    topology_profile: experiments/configs/topologies/multi-cluster-headlight.yaml
    workload_profile: experiments/configs/workloads/diurnal.yaml
    seeds:
    - 101
    - 102
    - 103
    - 104
    - 105
    duration_seconds: 2400
    warmup_seconds: 480
    sampling_interval_seconds: 15
    protocol:
      version: research-v3
      hash: 833d85432bb646181a173d8991bd9fbfec3558dbb72dda4191891d7e55748545
      path: experiments/configs/protocols/research-v3.yaml
    sla:
      p95_latency_ms: 1000
      minimum_success_rate: 0.99
      max_violation_window_seconds: 60
    output_dir: results/socc26/keda-diurnal-multi-cluster-headlight
    reset_policy:
      between_seeds: true
      delete_pods: true
      clear_controller_state: true
    capture:
      raw_logs: true
      prometheus_snapshots: true
      kubernetes_events: true
      crp_state_transitions: true
      actions_handler_batches: true
      ai_inference_times: true
      model_checkpoints: true
    notes: Two-cluster paper comparison run using common paired seeds for KEDA.
