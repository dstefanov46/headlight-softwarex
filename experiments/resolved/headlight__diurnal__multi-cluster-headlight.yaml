apiVersion: headlight.experiments/v1alpha1
kind: ResolvedExperimentManifest
metadata:
  name: headlight__diurnal__multi-cluster-headlight
spec:
  controller:
    controller: headlight
    implementation_state: ready
    setup_script: ai-module/ai_module_setup.sh
    deployment_manifest: ai-module/deployments/ai-module-deployment.yaml
    training_entrypoint: ai-module/ai-module/train_model.py
    inference_entrypoint: ai-module/ai-module/live_inference.py
    metrics_collector: ai-module/metrics/fetch_service_metrics.py
    actuation_path: actions-handler
    notes: Frozen multitask graph forecaster using the shared deterministic safety
      policy.
    sampling_interval_seconds: 15
    controller_variant: full
    image_tag_env: HEADLIGHT_AI_IMAGE
    training_trace: results/calibration/train-ticket-calibration.csv
    model_config: experiments/configs/models/headlight-full.yaml
    service_profile: ai-module/configs/service_profiles/advanced-ticket.json
    model_bundle_env: HEADLIGHT_MODEL_BUNDLE_DIR
    lookback_samples: 24
    forecast_horizon_samples: 12
    forecast_horizon_seconds: 180
    online_retraining: false
  topology:
    mode: multi-cluster-headlight
    namespace: trainticket
    active_clusters:
    - cluster2
    - cluster3
    clusters_file: ai-module/configs/clusters.json
    services_file: ai-module/configs/application_services.json
    additional_services_file: ai-module/configs/additional_services.json
    placement_source: actions-handler
    notes: Dynamic multi-cluster mode using Actions Handler and ControlledReplicaPropagation.
  workload:
    pattern: diurnal
    duration_seconds: 3600
    warmup_seconds: 300
    locust:
      spawn_rate: 20
      min_users: 25
      max_users: 250
      cycle_seconds: 3600
      phase_offset_seconds: 0
    notes: One-hour compressed daily cycle for repeatable measured runs.
    sampling_interval_seconds: 15
    shape_parameters:
      spawn_rate: 20
      min_users: 25
      max_users: 250
      cycle_seconds: 3600
      phase_offset_seconds: 0
  run:
    controller_profile: experiments/configs/baselines/headlight.yaml
    topology_profile: experiments/configs/topologies/multi-cluster-headlight.yaml
    workload_profile: experiments/configs/workloads/diurnal.yaml
    seeds:
    - 101
    - 102
    - 103
    - 104
    - 105
    duration_seconds: 3600
    warmup_seconds: 300
    sampling_interval_seconds: 15
    sla:
      p95_latency_ms: 1000
      minimum_success_rate: 0.99
      max_violation_window_seconds: 60
    output_dir: results/softwarex/headlight-diurnal-multi-cluster-headlight
    reset_policy:
      between_seeds: true
      delete_pods: true
      clear_controller_state: true
    capture:
      raw_logs: true
      prometheus_snapshots: true
      kubernetes_events: true
      crp_state_transitions: true
      actions_handler_batches: true
      ai_inference_times: true
      model_checkpoints: true
    notes: Generated measured comparison run using common paired seeds.
