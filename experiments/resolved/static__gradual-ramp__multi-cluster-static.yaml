apiVersion: headlight.experiments/v1alpha1
kind: ResolvedExperimentManifest
metadata:
  name: static__gradual-ramp__multi-cluster-static
spec:
  controller:
    controller: static
    implementation_state: ready
    setup_script: experiments/scripts/setup_static_baseline.sh
    entrypoint: ai-module/baselines/static_autoscaler.py
    metrics_collector: ai-module/metrics/fetch_service_metrics.py
    actuation_path: actions-handler
    notes: Fixed provisioning baseline with no online learning or reactive scaling.
    sampling_interval_seconds: 15
    controller_variant: calibration-p95-static
    image_tag_env: HEADLIGHT_STATIC_IMAGE
    training_trace: results/calibration/train-ticket-calibration.csv
    policy:
      replica_source: calibration_trace_p95_demand
      cluster_weights:
        cluster2: 3
        cluster3: 5
  topology:
    mode: multi-cluster-static
    namespace: trainticket
    active_clusters:
    - cluster2
    - cluster3
    clusters_file: ai-module/configs/clusters.json
    services_file: ai-module/configs/application_services.json
    additional_services_file: ai-module/configs/additional_services.json
    placement_source: fixed-plan
    default_replica_weights:
      cluster2: 3
      cluster3: 5
    notes: Static federation baseline derived from current cluster capacity limits.
  workload:
    pattern: gradual-ramp
    duration_seconds: 3000
    warmup_seconds: 300
    locust:
      spawn_rate: 15
      start_users: 20
      end_users: 320
      ramp_seconds: 1200
      hold_seconds: 600
    notes: Monotonic growth workload used to measure anticipation of sustained demand.
    sampling_interval_seconds: 15
    shape_parameters:
      spawn_rate: 15
      start_users: 20
      end_users: 320
      ramp_seconds: 1200
      hold_seconds: 600
  run:
    controller_profile: experiments/configs/baselines/static.yaml
    topology_profile: experiments/configs/topologies/multi-cluster-static.yaml
    workload_profile: experiments/configs/workloads/gradual-ramp.yaml
    seeds:
    - 101
    - 102
    - 103
    - 104
    - 105
    duration_seconds: 3000
    warmup_seconds: 300
    sampling_interval_seconds: 15
    sla:
      p95_latency_ms: 1000
      minimum_success_rate: 0.99
      max_violation_window_seconds: 60
    output_dir: results/softwarex/static-gradual-ramp-multi-cluster-static
    reset_policy:
      between_seeds: true
      delete_pods: true
      clear_controller_state: true
    capture:
      raw_logs: true
      prometheus_snapshots: true
      kubernetes_events: true
      crp_state_transitions: true
      actions_handler_batches: true
      ai_inference_times: true
      model_checkpoints: true
    notes: Generated measured comparison run using common paired seeds.
