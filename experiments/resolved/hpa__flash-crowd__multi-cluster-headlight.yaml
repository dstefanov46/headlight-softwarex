apiVersion: headlight.experiments/v1alpha1
kind: ResolvedExperimentManifest
metadata:
  name: hpa__flash-crowd__multi-cluster-headlight
spec:
  controller:
    controller: hpa
    implementation_state: ready
    setup_script: ai-module/kubernetes_hpa_setup.sh
    deployment_manifest: ai-module/deployments/kubernetes-autoscaler-eval-deployment.yaml
    hpa_manifest: ai-module/kubernetes-autoscaler/hpa.yaml
    metrics_collector: ai-module/metrics/fetch_service_metrics.py
    actuation_path: kubernetes-hpa
    notes: Native Kubernetes baseline; kept separate from Actions Handler by design.
    sampling_interval_seconds: 15
    controller_variant: native-hpa
    image_tag_env: HEADLIGHT_HPA_IMAGE
  topology:
    mode: multi-cluster-headlight
    namespace: trainticket
    active_clusters:
    - cluster2
    - cluster3
    clusters_file: ai-module/configs/clusters.json
    services_file: ai-module/configs/application_services.json
    additional_services_file: ai-module/configs/additional_services.json
    placement_source: actions-handler
    notes: Dynamic multi-cluster mode using Actions Handler and ControlledReplicaPropagation.
  workload:
    pattern: flash-crowd
    duration_seconds: 2400
    warmup_seconds: 300
    locust:
      spawn_rate: 40
      base_users: 30
      spike_users: 400
      spike_start_seconds: &id001
      - 600
      - 1500
      spike_duration_seconds: 180
    notes: Sharp surge followed by controlled decay; intended to stress proactive
      scaling.
    sampling_interval_seconds: 15
    shape_parameters:
      spawn_rate: 40
      base_users: 30
      spike_users: 400
      spike_start_seconds: *id001
      spike_duration_seconds: 180
  run:
    controller_profile: experiments/configs/baselines/hpa.yaml
    topology_profile: experiments/configs/topologies/multi-cluster-headlight.yaml
    workload_profile: experiments/configs/workloads/flash-crowd.yaml
    seeds:
    - 101
    - 102
    - 103
    - 104
    - 105
    duration_seconds: 2400
    warmup_seconds: 300
    sampling_interval_seconds: 15
    sla:
      p95_latency_ms: 1000
      minimum_success_rate: 0.99
      max_violation_window_seconds: 60
    output_dir: results/softwarex/hpa-flash-crowd-multi-cluster-headlight
    reset_policy:
      between_seeds: true
      delete_pods: true
      clear_controller_state: true
    capture:
      raw_logs: true
      prometheus_snapshots: true
      kubernetes_events: true
      crp_state_transitions: true
      actions_handler_batches: true
      ai_inference_times: true
      model_checkpoints: true
    notes: Two-cluster measured comparison run using common paired seeds.
