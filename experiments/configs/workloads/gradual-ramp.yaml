apiVersion: headlight.experiments/v1alpha1
kind: WorkloadProfile
metadata:
  name: gradual-ramp
spec:
  pattern: gradual-ramp
  duration_seconds: 3000
  warmup_seconds: 300
  locust:
    spawn_rate: 15
    start_users: 20
    end_users: 320
    ramp_seconds: 1200
    hold_seconds: 600
  notes: Monotonic growth workload used to measure anticipation of sustained demand.
  sampling_interval_seconds: 15
  shape_parameters:
    spawn_rate: 15
    start_users: 20
    end_users: 320
    ramp_seconds: 1200
    hold_seconds: 600
