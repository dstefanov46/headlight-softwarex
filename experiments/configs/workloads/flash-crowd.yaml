apiVersion: headlight.experiments/v1alpha1
kind: WorkloadProfile
metadata:
  name: flash-crowd
spec:
  pattern: flash-crowd
  duration_seconds: 2400
  warmup_seconds: 300
  locust:
    spawn_rate: 40
    base_users: 30
    spike_users: 400
    spike_start_seconds: &id001
    - 600
    - 1500
    spike_duration_seconds: 180
  notes: Sharp surge followed by controlled decay; intended to stress proactive scaling.
  sampling_interval_seconds: 15
  shape_parameters:
    spawn_rate: 40
    base_users: 30
    spike_users: 400
    spike_start_seconds: *id001
    spike_duration_seconds: 180
