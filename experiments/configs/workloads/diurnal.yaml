apiVersion: headlight.experiments/v1alpha1
kind: WorkloadProfile
metadata:
  name: diurnal
spec:
  pattern: diurnal
  duration_seconds: 2400
  warmup_seconds: 480
  capacity_users: 10
  capacity_users_env: HEADLIGHT_EVALUATION_CAPACITY
  locust:
    spawn_rate: 20
    min_users: "0.2C"
    max_users: C
    cycle_seconds: 1200
    phase_offset_seconds: 0
  notes: Two compressed daily cycles for repeatable paper runs.
  sampling_interval_seconds: 15
  shape_parameters:
    spawn_rate: 20
    min_users: "0.2C"
    max_users: C
    cycle_seconds: 1200
    phase_offset_seconds: 0
