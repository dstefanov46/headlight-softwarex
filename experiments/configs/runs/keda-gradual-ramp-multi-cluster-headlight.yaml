apiVersion: headlight.experiments/v1alpha1
kind: ExperimentRun
metadata:
  name: keda__gradual-ramp__multi-cluster-headlight
spec:
  controller_profile: experiments/configs/baselines/keda.yaml
  topology_profile: experiments/configs/topologies/multi-cluster-headlight.yaml
  workload_profile: experiments/configs/workloads/gradual-ramp.yaml
  seeds:
  - 101
  - 102
  - 103
  - 104
  - 105
  duration_seconds: 1200
  warmup_seconds: 480
  sampling_interval_seconds: 15
  protocol:
    version: research-v3
    hash: 833d85432bb646181a173d8991bd9fbfec3558dbb72dda4191891d7e55748545
    path: experiments/configs/protocols/research-v3.yaml
  sla:
    p95_latency_ms: 1000
    minimum_success_rate: 0.99
    max_violation_window_seconds: 60
  output_dir: results/socc26/keda-gradual-ramp-multi-cluster-headlight
  reset_policy:
    between_seeds: true
    delete_pods: true
    clear_controller_state: true
  capture:
    raw_logs: true
    prometheus_snapshots: true
    kubernetes_events: true
    crp_state_transitions: true
    actions_handler_batches: true
    ai_inference_times: true
    model_checkpoints: true
  notes: Two-cluster paper comparison run using common paired seeds for KEDA.
