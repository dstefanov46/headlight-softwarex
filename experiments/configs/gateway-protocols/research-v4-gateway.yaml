apiVersion: headlight.experiments/v1alpha1
kind: GatewayExperimentProtocol
metadata:
  name: research-v4-gateway-v1
spec:
  version: research-v4-gateway-v1
  status: evaluation-not-frozen-paper-matrix
  base_protocol_path: experiments/configs/protocols/research-v3.yaml
  base_protocol_sha256: 833d85432bb646181a173d8991bd9fbfec3558dbb72dda4191891d7e55748545
  load_generator_cluster: cluster1
  gateway_cluster: cluster1
  gateway_namespace: trainticket
  gateway_url: http://trainticket-gateway.trainticket.svc.cluster.local:8080
  workload_clusters: [cluster2, cluster3]
  transaction_mix: advanced-ticket
  entry_services:
    auth: ts-auth-service
    route: ts-route-service
    travel: ts-travel-service
  routing_rule: one-weight-unit-per-ready-pod-endpointslice-address
  update_interval_seconds: 10
  zero_ready_endpoint_weight: 0
  comparison_rule: all-controllers-must-use-identical-gateway-and-workload
  prior_research_v3_cells_directly_comparable: false
